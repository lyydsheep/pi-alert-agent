[unix_http_server]
file=/data/workspace/pi-alert-agent-validation/supervisor.sock
chmod=0600

[supervisord]
logfile=/data/workspace/pi-alert-agent-validation/supervisor.log
pidfile=/data/workspace/pi-alert-agent-validation/supervisor.pid
childlogdir=/data/workspace/pi-alert-agent-validation

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///data/workspace/pi-alert-agent-validation/supervisor.sock

[program:phoenix]
command=/bin/sh -c 'set -a; . /data/workspace/pi-alert-agent-validation/private/phoenix.env; /data/workspace/pi-alert-agent-validation/phoenix-runtime/bin/python /data/workspace/pi-alert-agent-validation/app/scripts/patch-phoenix-bind.py && exec /data/workspace/pi-alert-agent-validation/phoenix-runtime/bin/python -m phoenix.server.main serve'
autostart=false
autorestart=unexpected
stopasgroup=true
killasgroup=true
stopwaitsecs=90
umask=0077

[program:phoenix-viewer]
directory=/data/workspace/pi-alert-agent-validation/app
command=/bin/sh -c 'set -a; . /data/workspace/pi-alert-agent-validation/private/phoenix-viewer.env; export PHOENIX_INTERNAL_URL=http://127.0.0.1:6006 HOST=0.0.0.0 PORT=8081; exec /data/workspace/pi-alert-agent-validation/runtime/node_modules/node/bin/node src/phoenix-public.ts'
autostart=false
autorestart=unexpected
stopasgroup=true
killasgroup=true
umask=0077

[program:alert-agent]
directory=/data/workspace/pi-alert-agent-validation/app
command=/bin/sh -c 'set -a; . /data/workspace/pi-alert-agent-validation/private/runtime.env; exec /data/workspace/pi-alert-agent-validation/runtime/node_modules/node/bin/node src/main.ts /data/workspace/pi-alert-agent-validation/private/config.json'
autostart=false
autorestart=unexpected
stopasgroup=true
killasgroup=true
stopwaitsecs=90
umask=0077
